<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fronts core-only example</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Fronts 2.0 execution proof</p>
      <h1>Core-only application runtime</h1>
      <p>No Module Federation runtime, bundler plugin, or framework adapter is used.</p>
      <div class="controls">
        <button id="update-application" type="button">Update application props</button>
        <button id="unmount-application" type="button">Unmount application</button>
      </div>
      <p class="status" id="service-event">Waiting for scoped service event…</p>
      <p class="status" data-state="mounting" id="host-audit">Mounting application…</p>
      <section aria-label="Application slot" id="application-slot"></section>
    </main>
  </body>
</html>
